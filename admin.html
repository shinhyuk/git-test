<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 현대오토에버 채용</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-header">
        <span class="logo-hyundai">HYUNDAI</span>
        <span class="logo-autoever">AutoEver</span>
        <p>채용 관리 시스템</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="loginId">관리자 ID</label>
          <input type="text" id="loginId" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label for="loginPw">비밀번호</label>
          <input type="password" id="loginPw" placeholder="admin" required>
        </div>
        <p class="login-hint">테스트 계정: admin / admin</p>
        <button type="submit" class="btn btn-primary btn-full">로그인</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div class="admin-layout" id="adminLayout" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
          <span class="logo-hyundai">HYUNDAI</span>
          <span class="logo-autoever">AutoEver</span>
        </a>
        <span class="sidebar-badge">Admin</span>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li>
            <a href="#" class="sidebar-link active" data-page="dashboard">
              <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
              대시보드
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-page="jobs">
              <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="2"/><rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              채용공고 관리
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-page="applicants">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2" stroke="currentColor" stroke-width="2"/></svg>
              지원자 관리
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-page="stats">
              <svg viewBox="0 0 24 24" fill="none"><path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              통계
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-link" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          로그아웃
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <h1 id="pageTitle">대시보드</h1>
        <div class="admin-header-right">
          <span class="admin-user">관리자님</span>
          <a href="index.html" class="btn btn-outline-sm">사이트 보기</a>
        </div>
      </header>

      <div class="admin-content" id="adminContent">
        <!-- Dashboard page (default) -->
      </div>
    </main>
  </div>

  <!-- Job Form Modal -->
  <div class="modal-overlay" id="jobFormModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="jobFormTitle">채용공고 등록</h2>
        <button class="modal-close" id="jobFormClose">&times;</button>
      </div>
      <form class="admin-form" id="jobForm">
        <input type="hidden" id="editJobId">
        <div class="form-row">
          <div class="form-group">
            <label for="jobTitle">공고 제목 *</label>
            <input type="text" id="jobTitle" required placeholder="예: 클라우드 엔지니어">
          </div>
          <div class="form-group">
            <label for="jobDept">부서 *</label>
            <input type="text" id="jobDept" required placeholder="예: 클라우드플랫폼팀">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="jobType">채용 유형 *</label>
            <select id="jobType" required>
              <option value="경력">경력</option>
              <option value="신입">신입</option>
              <option value="인턴">인턴</option>
            </select>
          </div>
          <div class="form-group">
            <label for="jobCategory">카테고리 *</label>
            <select id="jobCategory" required>
              <option value="개발">개발</option>
              <option value="AI/데이터">AI/데이터</option>
              <option value="IT인프라">IT인프라</option>
              <option value="보안">보안</option>
              <option value="컨설팅">컨설팅</option>
              <option value="신입공채">신입공채</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="jobLocation">근무지 *</label>
            <input type="text" id="jobLocation" required placeholder="예: 서울 강남구">
          </div>
          <div class="form-group">
            <label for="jobExperience">경력 요건</label>
            <input type="text" id="jobExperience" placeholder="예: 3~5년">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="jobDeadline">마감일 *</label>
            <input type="date" id="jobDeadline" required>
          </div>
          <div class="form-group">
            <label for="jobStatus">상태</label>
            <select id="jobStatus">
              <option value="진행중">진행중</option>
              <option value="마감">마감</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="jobDesc">직무 설명 *</label>
          <textarea id="jobDesc" rows="3" required placeholder="직무에 대한 상세 설명을 입력하세요"></textarea>
        </div>
        <div class="form-group">
          <label for="jobReqs">자격 요건 (줄바꿈으로 구분)</label>
          <textarea id="jobReqs" rows="4" placeholder="한 줄에 하나씩 입력하세요"></textarea>
        </div>
        <div class="form-group">
          <label for="jobPreferred">우대 사항 (줄바꿈으로 구분)</label>
          <textarea id="jobPreferred" rows="3" placeholder="한 줄에 하나씩 입력하세요"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="document.getElementById('jobFormModal').classList.remove('active')">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Applicant Detail Modal -->
  <div class="modal-overlay" id="applicantModal">
    <div class="modal">
      <div class="modal-header">
        <h2>지원자 상세</h2>
        <button class="modal-close" id="applicantModalClose">&times;</button>
      </div>
      <div class="modal-body" id="applicantDetail">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
