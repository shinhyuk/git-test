<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 도우미 - 현대오토에버 채용</title>
  <link rel="stylesheet" href="css/chat.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="logo">
          <span class="logo-hyundai">HYUNDAI</span>
          <span class="logo-autoever">AutoEver</span>
        </a>
        <span class="header-badge">AI 도우미</span>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="newChatBtn" title="새 대화">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="btn-icon" id="apiKeyToggle" title="API 키 설정">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.78 7.78 5.5 5.5 0 017.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a href="index.html" class="btn-back">채용 홈</a>
      </div>
    </div>
  </header>

  <!-- API Key Panel -->
  <div class="api-key-panel" id="apiKeyPanel">
    <div class="api-key-inner">
      <div class="api-key-status" id="apiKeyStatus">
        <span class="status-dot red"></span>
        <span>API 키가 설정되지 않았습니다</span>
      </div>
      <div class="api-key-form">
        <div class="api-key-input-wrap">
          <input type="password" id="apiKeyInput" placeholder="sk-ant-... Anthropic API 키를 입력하세요" autocomplete="off">
          <button class="btn-toggle-pw" id="togglePwBtn" title="비밀번호 표시">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <button class="btn btn-primary btn-sm" id="saveKeyBtn">저장</button>
        <button class="btn btn-ghost btn-sm" id="deleteKeyBtn">삭제</button>
      </div>
      <p class="api-key-note">API 키는 브라우저 로컬 스토리지에만 저장되며, 외부 서버로 전송되지 않습니다. <a href="https://console.anthropic.com/" target="_blank" rel="noopener">키 발급받기</a></p>
    </div>
  </div>

  <!-- Chat Area -->
  <main class="chat-area" id="chatArea">
    <div class="chat-messages" id="chatMessages">
      <!-- Welcome message -->
      <div class="message message-assistant">
        <div class="message-avatar">AI</div>
        <div class="message-content">
          <p>안녕하세요! <strong>현대오토에버 채용 AI 도우미</strong>입니다.</p>
          <p>채용 관련 궁금한 점을 자유롭게 질문해주세요. 예를 들어:</p>
          <ul>
            <li>현재 진행 중인 채용공고가 궁금해요</li>
            <li>채용 절차가 어떻게 되나요?</li>
            <li>개발자 포지션에 지원하고 싶어요</li>
            <li>현대오토에버의 기업문화는 어떤가요?</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-inner">
      <textarea id="chatInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled title="전송">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="input-hint">Enter로 전송, Shift+Enter로 줄바꿈</p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/chat.js"></script>
</body>
</html>
